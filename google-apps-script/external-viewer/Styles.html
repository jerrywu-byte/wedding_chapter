<style>
  :root {
    color-scheme: light;
    --background: #f3f0eb;
    --surface: #fffdf9;
    --surface-muted: #ede8e1;
    --line: #d9d1c7;
    --ink: #3e3935;
    --muted: #746d67;
    --accent: #82766b;
    --accent-dark: #675d54;
    --sage: #a8afa3;
    --shadow: 0 20px 54px rgba(79, 68, 58, 0.11);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  }

  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--background); color: var(--ink); }
  button, input, select { font: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: wait; opacity: 0.62; }

  .viewer-shell { min-height: 100vh; }
  .auth-card {
    width: min(440px, calc(100% - 32px));
    margin: 9vh auto 40px;
    padding: 42px;
    background: var(--surface);
    border: 1px solid rgba(130, 118, 107, 0.16);
    border-radius: 28px;
    box-shadow: var(--shadow);
  }

  .brand-mark, .placeholder-icon {
    display: grid; place-items: center; width: 52px; height: 52px;
    border: 1px solid var(--line); border-radius: 50%; color: var(--accent);
    font-family: Georgia, serif; letter-spacing: 0.08em;
  }
  .eyebrow { margin: 22px 0 4px; color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
  h1, h2, h3, p { margin-top: 0; }
  h1 { margin-bottom: 14px; font-family: "Noto Serif TC", Georgia, serif; font-size: clamp(28px, 4vw, 38px); font-weight: 600; }
  .auth-intro { color: var(--muted); line-height: 1.75; }
  label { display: block; margin: 22px 0 8px; color: var(--muted); font-size: 13px; font-weight: 700; }
  input, select {
    width: 100%; min-height: 46px; padding: 10px 14px; color: var(--ink);
    background: #fff; border: 1px solid var(--line); border-radius: 12px; outline: none;
  }
  input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(130, 118, 107, .12); }
  .primary-button {
    width: 100%; min-height: 48px; margin-top: 20px; border: 0; border-radius: 999px;
    color: #fff; background: var(--accent); font-weight: 700; transition: background .2s, transform .2s;
  }
  .primary-button:hover { background: var(--accent-dark); transform: translateY(-1px); }
  .text-button { padding: 8px 2px; color: var(--accent-dark); background: transparent; border: 0; text-decoration: underline; text-underline-offset: 4px; }
  #returnToLogin { display: block; margin: 18px auto 0; }
  .form-message { min-height: 24px; margin: 18px 0 0; color: var(--muted); line-height: 1.6; text-align: center; }
  .form-message.is-error { color: #8a5f58; }
  .account-card { padding: 16px; background: var(--surface-muted); border-radius: 14px; }
  .account-card span { display: block; margin-bottom: 4px; color: var(--muted); font-size: 12px; }
  .account-card strong { overflow-wrap: anywhere; }

  .app-shell { position: relative; min-height: 100vh; padding: 24px; overflow: hidden; }
  .app-header {
    position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between;
    max-width: 1480px; margin: 0 auto 18px; padding: 0 6px;
  }
  .app-header .eyebrow { margin-top: 0; }
  .app-header h1 { margin: 0; font-size: 28px; }
  .viewer-identity { display: flex; align-items: center; gap: 18px; color: var(--muted); font-size: 13px; }
  .app-grid {
    position: relative; z-index: 2; display: grid; grid-template-columns: minmax(300px, 390px) minmax(0, 1fr);
    gap: 18px; max-width: 1480px; min-height: calc(100vh - 118px); margin: 0 auto;
  }
  .case-sidebar, .case-detail {
    background: rgba(255, 253, 249, .96); border: 1px solid rgba(130, 118, 107, .16);
    border-radius: 22px; box-shadow: 0 12px 34px rgba(79, 68, 58, .07);
  }
  .case-sidebar { padding: 20px; overflow: hidden; }
  .filters { padding-bottom: 18px; border-bottom: 1px solid var(--line); }
  .filters label:first-child { margin-top: 0; }
  .filters label { margin-top: 14px; }
  .list-heading { display: flex; align-items: baseline; justify-content: space-between; padding: 20px 2px 10px; }
  .list-heading h2 { margin: 0; font-size: 18px; }
  .list-heading span { color: var(--muted); font-size: 13px; }
  .case-list { max-height: calc(100vh - 348px); overflow: auto; padding-right: 4px; }
  .case-card {
    width: 100%; margin: 0 0 10px; padding: 15px; text-align: left; color: var(--ink);
    background: #fff; border: 1px solid var(--line); border-radius: 15px;
  }
  .case-card:hover, .case-card.is-active { border-color: var(--accent); background: #faf7f2; }
  .case-card strong, .case-card span { display: block; }
  .case-card strong { margin: 5px 0; font-size: 16px; }
  .case-card span { color: var(--muted); font-size: 12px; line-height: 1.55; }
  .case-number { color: var(--accent) !important; font-weight: 700; letter-spacing: .03em; }
  .empty-message { padding: 22px 6px; color: var(--muted); text-align: center; }

  .case-detail { position: relative; padding: clamp(24px, 4vw, 52px); overflow: auto; }
  .detail-placeholder { display: grid; place-items: center; min-height: 55vh; text-align: center; color: var(--muted); }
  .detail-placeholder h2 { margin: 18px 0 7px; color: var(--ink); }
  .detail-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 30px; }
  .detail-heading h2 { margin: 5px 0 0; font-family: "Noto Serif TC", Georgia, serif; font-size: 30px; font-weight: 600; }
  .serial-number { margin: 0; color: var(--accent); font-size: 13px; font-weight: 700; letter-spacing: .08em; }
  .readonly-badge { padding: 7px 12px; color: #596157; background: #e7ebe4; border-radius: 999px; font-size: 12px; font-weight: 700; }
  .detail-section { padding: 26px 0; border-top: 1px solid var(--line); }
  .detail-section h3 { margin-bottom: 20px; font-size: 17px; }
  .information-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; margin: 0; }
  .information-item { min-width: 0; }
  .information-item dt { margin-bottom: 5px; color: var(--muted); font-size: 12px; }
  .information-item dd { margin: 0; overflow-wrap: anywhere; line-height: 1.65; }
  .consultation-list { display: grid; gap: 14px; }
  .consultation-card { padding: 18px; background: #f7f4ef; border: 1px solid #e5ddd4; border-radius: 16px; }
  .consultation-card h4 { margin: 0 0 10px; color: var(--accent-dark); font-size: 14px; }
  .consultation-card p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.8; }
  .back-button { display: none; margin-bottom: 18px; padding: 8px 0; color: var(--accent-dark); background: none; border: 0; }
  .watermark { position: fixed; inset: 90px 0 0; z-index: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 80px; padding: 20px; pointer-events: none; overflow: hidden; transform: rotate(-16deg) scale(1.16); opacity: .055; }
  .watermark span { color: var(--accent-dark); font-size: 13px; font-weight: 700; line-height: 1.7; text-align: center; white-space: pre-line; }
  .toast { position: fixed; right: 24px; bottom: 24px; z-index: 4; max-width: 360px; padding: 13px 17px; color: #fff; background: var(--accent-dark); border-radius: 12px; box-shadow: var(--shadow); }

  @media (max-width: 820px) {
    .auth-card { margin-top: 28px; padding: 30px 24px; }
    .app-shell { padding: 16px; }
    .app-header { align-items: flex-start; }
    .app-header h1 { font-size: 23px; }
    .viewer-identity { flex-direction: column; align-items: flex-end; gap: 2px; max-width: 48%; text-align: right; overflow-wrap: anywhere; }
    .app-grid { display: block; min-height: 0; }
    .case-sidebar, .case-detail { min-height: calc(100vh - 112px); border-radius: 18px; }
    .case-list { max-height: none; }
    .case-detail { display: none; padding: 22px 18px; }
    .app-shell.mobile-detail-open .case-sidebar { display: none; }
    .app-shell.mobile-detail-open .case-detail { display: block; }
    .back-button { display: inline-block; }
    .information-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .watermark { grid-template-columns: repeat(2, 1fr); }
  }

  @media (max-width: 480px) {
    .information-grid { grid-template-columns: 1fr; }
    .detail-heading h2 { font-size: 25px; }
  }
</style>
