<style>
  :root {
    color-scheme: light;
    --followup-ink: #3e3b38;
    --followup-muted: #77736e;
    --followup-gold: #9f8c70;
    --followup-gold-soft: #b7a98f;
    --followup-workspace: #e8e6e1;
    --followup-list: #efeee9;
    --followup-card: #f4f2ee;
    --followup-surface: #f7f5f1;
    --followup-input: #f2f0ec;
    --followup-line: #d3cfc8;
    --followup-divider: #ddd9d2;
    --followup-selected: #e8ebe5;
    --followup-selected-line: #929b88;
    --followup-font-sans: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC",
      system-ui, sans-serif;
    font-family: var(--followup-font-sans);
    font-size: 15px;
    font-weight: 400;
    line-height: 1.6;
  }

  * { box-sizing: border-box; }
  html, body { min-width: 0; min-height: 100%; margin: 0; }
  html, body { color: var(--followup-ink); background: var(--followup-workspace); }
  body { overflow-x: hidden; }
  button, input, textarea { color: inherit; font: inherit; }
  button:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--followup-gold);
    outline-offset: 2px;
  }
  [hidden] { display: none !important; }
  .sr-only {
    width: 1px; height: 1px; padding: 0; margin: -1px; position: absolute;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }

  .followup-shell {
    width: 100%; min-height: 100svh; display: grid;
    grid-template-columns: minmax(300px, 360px) minmax(0, 1fr);
    background: var(--followup-workspace);
  }
  .followup-list-panel {
    min-width: 0; height: 100svh; padding: 30px 20px 22px; position: sticky; top: 0;

    background: var(--followup-list);

  .followup-list-header h1 {

  .followup-list-header > p:last-child {

  .followup-search {

  }

  }

    padding: 16px 6px 8px; display: flex; justify-content: space-between;

    line-height: 1.45; letter-spacing: .06em;
  }
  .followup-case-list {

  }

  }
  .followup-case__meta {
    margin-top: 5px; color: var(--followup-muted); font-family: var(--followup-font-sans);
    font-size: 11px; font-weight: 500; line-height: 1.45; letter-spacing: .02em;
  }

  .status-booked { color: #61705f; background: #e1e9df; }
  .status-cancelled { color: #876663; background: #eee1df; }
  .status-lost { color: #706a65; background: #e7e4e1; }
  .followup-state {
    margin: 26px 0; color: var(--followup-muted); text-align: center;
    font-size: 14px; line-height: 1.65;
  }

  .followup-detail-panel {
    min-width: 0; padding: 30px clamp(28px, 5vw, 76px) 64px; overflow: hidden;
    background: var(--followup-workspace);
  }
  .followup-detail-wrap { width: min(920px, 100%); margin: 0 auto; }
  .followup-back { display: none; }
  .followup-detail-state { margin-top: 25vh; }
  .followup-detail-header {
    margin-bottom: 14px; display: flex; justify-content: space-between; align-items: flex-end; gap: 20px;
  }
  .followup-detail-header h2 {

  .followup-section-heading {

  }
  .followup-section-heading > span {

    border: 1px solid var(--followup-gold-soft); border-radius: 50%;
    color: var(--followup-gold); font-family: var(--followup-font-sans);
    font-size: 10px; font-weight: 500; line-height: 1;
  }
  .followup-section-heading p {

    font-weight: 600; line-height: 1.4; letter-spacing: .18em;
  }
  .followup-section-heading h3 {
    margin: 0; font-family: var(--followup-font-sans);
    font-size: 19px; font-weight: 600; line-height: 1.4; letter-spacing: .03em;
  }

  .followup-primary-marker input[type="checkbox"] {

  .followup-basic-grid dd input[type="number"] {

  .followup-basic-grid dd input[type="number"]:focus {
    border-color: var(--followup-gold); box-shadow: 0 0 0 2px rgba(159,140,112,.12);

  .followup-consultations { display: grid; gap: 8px; }
  .followup-consultations details {

  }
  .followup-consultations summary {
    min-height: 50px; padding: 0 15px; display: flex; align-items: center;
    justify-content: space-between; gap: 12px; color: var(--followup-ink); cursor: pointer; list-style: none;
  }
  .followup-consultations summary::-webkit-details-marker { display: none; }
  .followup-consultations details[open] summary {
    border-bottom: 1px solid var(--followup-divider); background: var(--followup-card);
  }
  .followup-consultation-title {
    font-family: var(--followup-font-sans); font-size: 15px; font-weight: 600;
    line-height: 1.45; letter-spacing: .02em;
  }
  .followup-consultation-meta {
    display: flex; align-items: center; justify-content: flex-end; gap: 9px;
    color: var(--followup-muted); font-family: var(--followup-font-sans);
    font-size: 10px; font-weight: 500; line-height: 1.4; white-space: nowrap;
  }
  .followup-filled-badge {
    padding: 3px 7px; border-radius: 99px; color: #61705f;
    background: #e1e9df; font-weight: 600; letter-spacing: .06em;
  }
  .followup-consultation-meta i {
    width: 8px; height: 8px; margin: -4px 3px 0 5px;

    transform: rotate(45deg); transition: transform .2s ease;
  }
  .followup-consultations details[open] .followup-consultation-meta i {

  }
  .followup-consultation-fields { padding: 14px 15px 15px; }
  .followup-consultation-fields label {
    min-width: 0; display: flex; flex-direction: column; gap: 7px;
    color: var(--followup-muted); font-family: var(--followup-font-sans);
    font-size: 11px; font-weight: 500; line-height: 1.45; letter-spacing: .04em;
  }
  .followup-consultations textarea {
    width: 100%; min-width: 0; min-height: 82px; padding: 10px 13px;
    border: 1px solid var(--followup-line); border-radius: 11px;
    color: var(--followup-ink); background: var(--followup-input);
    font-family: var(--followup-font-sans); font-size: 14px; font-weight: 400;
    resize: vertical; line-height: 1.7; letter-spacing: .01em;
  }
  .followup-consultations textarea::placeholder { color: #9a958e; opacity: 1; }

  }
  .followup-closing-grid {

    font-family: var(--followup-font-sans); font-size: 14px; font-weight: 500;
    line-height: 1.4; letter-spacing: .02em;
  }
  .followup-status-options button:disabled { opacity: 1; cursor: default; }
  .followup-status-options button i {
    width: 7px; height: 7px; margin-right: 7px; display: inline-block;
    border-radius: 50%; background: var(--followup-gold-soft);
  }
  .followup-status-options button.is-active {
    box-shadow: 0 4px 12px rgba(62,59,56,.06);
  }

  }
  .followup-status-options button[data-status="已訂"].is-active {
    color: #61705f; border-color: #cbd7c8; background: #e1e9df;
  }
  .followup-status-options button[data-status="退訂"].is-active {
    color: #876663; border-color: #dbc9c6; background: #eee1df;
  }
  .followup-status-options button[data-status="流失"].is-active {
    color: #706a65; border-color: #d3cfcb; background: #e7e4e1;
  }
  .followup-status-options button[data-status="洽談中"].is-active i { background: #806f52; }
  .followup-status-options button[data-status="已訂"].is-active i { background: #61705f; }
  .followup-status-options button[data-status="退訂"].is-active i { background: #876663; }
  .followup-status-options button[data-status="流失"].is-active i { background: #706a65; }
  .followup-close-date input {
    width: 100%; min-height: 46px; margin: 0; padding: 0 13px;
    border: 1px solid var(--followup-line); border-radius: 11px; background: var(--followup-input);
    font-family: var(--followup-font-sans); font-size: 14px; font-weight: 500;
    line-height: 1.5; letter-spacing: .01em;
  }
  .followup-actions {
    padding: 30px 4px 0; display: flex; flex-direction: column; align-items: flex-end;
  }
  .followup-actions > p {
    margin: 0 0 12px; color: var(--followup-muted);
    font-size: 11px; font-weight: 400; line-height: 1.55;
  }
  .followup-actions > p.is-success { color: #61705f; }
  .followup-actions > p.is-error { color: #876663; }
  .followup-actions button {
    min-width: 190px; min-height: 52px; padding: 0 24px; border: 0; border-radius: 99px;

    font-family: var(--followup-font-sans); font-size: 14px; font-weight: 500;
    line-height: 1.4; letter-spacing: .02em;

  .followup-ownership-notice {

    font-size: 13px; line-height: 1.7;
  }
  .followup-note-list { list-style: none; padding: 0; margin: 0; }
  .followup-note-list li { padding: 14px 0; border-top: 1px solid var(--followup-divider); }
  .followup-note-list time { color: var(--followup-muted); font-size: 12px; margin-right: 12px; }
  .followup-note-list strong { font-size: 13px; font-weight: 600; }

  .followup-note-empty { color: var(--followup-muted); font-size: 13px; }
  .followup-note-composer { margin-top: 14px; border-top: 1px solid var(--followup-divider); padding-top: 12px; }
  .followup-note-composer summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; color: var(--followup-ink); }
  .followup-note-composer label { display: block; margin-bottom: 7px; color: var(--followup-muted); font-size: 12px; }
  .followup-note-composer textarea {
    width: 100%; min-width: 0; padding: 12px; border: 1px solid var(--followup-line);
    border-radius: 11px; background: var(--followup-input); resize: vertical; line-height: 1.7;
  }
  .followup-note-actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-top: 10px; }
  .followup-note-actions span { font-size: 11px; color: var(--followup-muted); }
  .followup-note-actions button {
    min-height: 44px; padding: 0 20px; border: 1px solid var(--followup-selected-line);
    border-radius: 11px; background: var(--followup-selected); cursor: pointer;
  }
  .followup-note-actions button:disabled { opacity: .56; cursor: not-allowed; }
  .followup-note-state { margin: 10px 0 0; color: var(--followup-muted); font-size: 12px; }
  .followup-note-state.is-success { color: #61705f; }
  .followup-note-state.is-error { color: #876663; }

  @media (max-width: 980px) {
    .followup-shell { grid-template-columns: 300px minmax(0, 1fr); }
    .followup-list-panel { padding-inline: 18px; }
    .followup-detail-panel { padding-inline: 24px; }
    .followup-basic-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .followup-closing-grid { grid-template-columns: 1fr; }
  }

  @media (max-width: 760px) {
    .followup-shell { min-height: 100svh; display: block; overflow-x: hidden; }
    .followup-list-panel {
      width: 100%; height: 100svh; padding: 30px 16px 20px; position: static; border: 0;
    }
    .followup-case-list { padding-bottom: max(16px, env(safe-area-inset-bottom)); }
    .followup-case { min-height: 72px; padding-inline: 13px; }

    .followup-shell--detail .followup-detail-panel { display: block; }
    .followup-back {

    }
    .followup-detail-header { margin: 0 4px 22px; align-items: flex-start; }
    .followup-detail-header h2 { font-size: clamp(26px, 8vw, 34px); }

    .followup-card { margin-top: 12px; padding: 20px 16px; border-radius: 18px; }
    .followup-basic-grid { grid-template-columns: 1fr; }
    .followup-basic-grid > div { padding: 12px; }
    .followup-consultation-fields { padding: 13px; }
    .followup-consultations summary { min-height: 54px; padding-inline: 13px; }
    .followup-status-options { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .followup-actions { align-items: stretch; }
    .followup-actions > p { text-align: center; }
    .followup-actions button { width: 100%; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { scroll-behavior: auto !important; transition: none !important; }
  }
</style>
