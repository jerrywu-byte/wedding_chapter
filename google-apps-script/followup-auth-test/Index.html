<!doctype html>
<html lang="zh-Hant">
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      :root {
        color: #403a30;
        background: #f7f3ea;
        font-family: Arial, "Noto Sans TC", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        box-sizing: border-box;
        width: min(560px, calc(100% - 32px));
        padding: 32px;
        border: 1px solid #d8c9aa;
        border-radius: 16px;
        background: #fffdf8;
        box-shadow: 0 12px 36px rgb(92 76 48 / 10%);
      }

      h1 {
        margin: 0 0 24px;
        color: #6f5b35;
        font-family: Georgia, "Noto Serif TC", serif;
        font-size: 28px;
      }

      dl {
        margin: 0;
      }

      div {
        display: grid;
        grid-template-columns: 180px 1fr;
        gap: 16px;
        padding: 14px 0;
        border-top: 1px solid #ebe3d3;
      }

      dt {
        font-weight: 700;
      }

      dd {
        margin: 0;
        overflow-wrap: anywhere;
      }

      .pass {
        color: #3f6c4c;
        font-weight: 700;
      }

      @media (max-width: 520px) {
        main {
          padding: 24px;
        }

        div {
          grid-template-columns: 1fr;
          gap: 6px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Authentication Test</h1>
      <dl>
        <div>
          <dt>Active user email</dt>
          <dd><?= email ?></dd>
        </div>
        <div>
          <dt>Domain validation</dt>
          <dd class="pass"><?= domainValid ? '通過' : '未通過' ?></dd>
        </div>
        <div>
          <dt>Email allowlist</dt>
          <dd class="pass"><?= emailAllowlisted ? '通過' : '未通過' ?></dd>
        </div>
      </dl>
    </main>
  </body>
</html>
