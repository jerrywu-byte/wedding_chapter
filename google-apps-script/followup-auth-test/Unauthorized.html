<!doctype html>
<html lang="zh-Hant">
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      :root {
        color: #403a30;
        background: #f7f3ea;
        font-family: Arial, "Noto Sans TC", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        box-sizing: border-box;
        width: min(560px, calc(100% - 32px));
        padding: 32px;
        border: 1px solid #d8c9aa;
        border-radius: 16px;
        background: #fffdf8;
        box-shadow: 0 12px 36px rgb(92 76 48 / 10%);
      }

      h1 {
        margin: 0 0 16px;
        color: #6f5b35;
        font-family: Georgia, "Noto Serif TC", serif;
        font-size: 28px;
      }

      p {
        margin: 0;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Authentication Test</h1>
      <p>您目前使用的 Google 帳號沒有 Follow-up 系統存取權限。</p>
    </main>
  </body>
</html>
